spring:
  application:
    name: BudgetingApp
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/mydb
    username: postgres
    password: postgres
    schema: public
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: public

security:
  jwt:
    secret-key: 07a23b4ba1cd474381e894e7ffcbb56607a23b4ba1cd474381e894e7ffcbb566 # 64 bytes
    expiration-time: 3600000 # 1 hour
